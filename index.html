<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Заявки</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div>
        <h1>Заявки учебного корпуса</h1>
    </div>

    <div class="add-form">
        <div class="form-row">
            <div class="form-group">
                <label for="title-input">Что случилось?</label>
                <input type="text" id="title-input">
            </div>
            <div class="form-group">
                <label for="room-input">Где?</label>
                <input type="text" id="room-input">
            </div>

            <div class="form-group">
                <label for="category-select">Категория</label>
                <select id="category-select">
                    <option value="">Выберите категорию</option>
                    <option value="Оборудование">Оборудование</option>
                    <option value="Аудитория">Аудитория</option>
                    <option value="Другое">Другое</option>
                </select>
            </div>
            <button class="btn-add" id="add-btn">Добавить заявку</button>
        </div>
        <div class="message" id="message"></div>
    </div>

    <div class="filters">
        <label class="filter-check">
            <input style="accent-color: #ff75f4;" type="checkbox" id="only-open-checkbox">
            Только открытые
        </label>
        <div class="filter-select">
            <label for="filter-category">Категория:</label>
            <select id="filter-category">
                <option value="">Все категории</option>
                <option value="Оборудование">Оборудование</option>
                <option value="Аудитория">Аудитория</option>
                <option value="Другое">Другое</option>
            </select>
        </div>
    </div>

    <div class="tickets-list" id="tickets-list"></div>

</body>
    <script src="script.js" defer></script>
</html>
